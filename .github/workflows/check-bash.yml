
name: Check bioinformatics scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-bash:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Check all Bash scripts
        run: |
          find scripts -type f -name "*.sh" -print0 |
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Confirm successful check
        run: echo "All Bash scripts passed syntax validation!"
